name = "aimm-proxy"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Secrets (NOT in this file — set via `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY
#   ELEVENLABS_API_KEY

# Semantic search (one-time manual setup — do not put secret values in this file):
#   npx wrangler vectorize create aimm-yt-kb --dimensions=1024 --metric=cosine
# Then uncomment this binding after the index exists and deploy:
# [[vectorize]]
# binding = "VEC_YT_KB"
# index_name = "aimm-yt-kb"
#
# Set these secrets with `npx wrangler secret put <NAME>`:
#   VOYAGE_API_KEY
#   COHERE_API_KEY
#   AIMM_INGEST_KEY

# Durable captures store (optional — see README "Durable captures").
# Terminal route: `npx wrangler kv namespace create aimm-captures`, then
# uncomment with the id it prints and `npx wrangler deploy`:
# [[kv_namespaces]]
# binding = "AIMM_KV"
# id = "<id from the create command>"
