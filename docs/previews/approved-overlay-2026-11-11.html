<style id="preview-spotify-logo-connect">
/* Existing header logo is the Connect control. The text button is hidden, not removed, so its script still runs. */
#eq.oz-mixcheck .mc-spotify-ref-controls #mcSpotifyConnect{display:none!important}
#eq.oz-mixcheck #mcSpotifyReference .mc-spotify-mark{cursor:pointer}
#eq.oz-mixcheck #mcSpotifyReference .mc-spotify-mark:focus-visible{outline:2px solid #6fe3ff;outline-offset:3px}
#eq.oz-mixcheck #mcSpotifyReference .mc-spotify-mark:hover{box-shadow:0 0 22px rgba(111,227,255,.7)!important}
</style>
<script id="preview-spotify-logo-connect-js">
(function(){
  function init(){
    var mark=document.querySelector('#mcSpotifyReference .mc-spotify-mark');
    var connect=document.getElementById('mcSpotifyConnect');
    if(!mark||!connect)return;
    mark.setAttribute('role','button');
    mark.setAttribute('tabindex','0');
    mark.setAttribute('aria-label','Connect Spotify');
    mark.setAttribute('title','Connect Spotify');
    function go(){ if(!connect.disabled) connect.click(); }
    mark.addEventListener('click',go);
    mark.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    new MutationObserver(function(){
      var on=connect.dataset.connected==='true';
      mark.setAttribute('aria-label',on?'Disconnect Spotify':'Connect Spotify');
      mark.setAttribute('title',on?'Disconnect Spotify':'Connect Spotify');
    }).observe(connect,{attributes:true,attributeFilter:['data-connected']});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
