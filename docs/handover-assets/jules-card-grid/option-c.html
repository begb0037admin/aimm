<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Option C: card grid</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:#050607;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e2e7ec}
.win{width:1440px;height:900px;display:grid;grid-template-columns:56px 1fr 84px;background:#0b0d10;overflow:hidden}
.side{background:#0f1215;border-right:1px solid #1c2026;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.side i{display:block;height:34px;border-radius:8px;background:#171a1e}
.side i.on{background:#2dd4bf}
.rail{background:#0f1215;border-left:1px solid #1c2026;padding:14px 10px;font-size:11px;color:#6b7280}
.rail b{display:block;color:#9aa4ae;margin-bottom:10px;font-size:12px}
.rail i{display:block;height:46px;border-radius:12px;background:#2b1a4a;margin-bottom:8px;opacity:.7}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:20px 24px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h2{margin:0;font-size:20px;letter-spacing:-.01em}
.sub{color:#8a939d;font-size:12px;margin-top:3px}
.btn{background:#1b1d20;color:#cbd0d6;border:1px solid #34383d;border-radius:7px;padding:8px 12px;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
.btn.primary{background:#2dd4bf;color:#0b0d10;border-color:#2dd4bf}
.btn:hover:not(.primary){border-color:#9442dc;background:linear-gradient(135deg,#9442dc22,#b970ff22)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;gap:6px}
.seg button{background:#1a1d21;color:#cbd0d6;border:1px solid #2a2e35;border-radius:7px;padding:7px 13px;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
.seg button:hover:not(.on){border-color:#9442dc}
.seg button.on{background:#2dd4bf;color:#0b0d10;border-color:#2dd4bf}
.seg.chain button{padding:8px 16px;font-size:13px}
.seg button em{font-style:normal;opacity:.65;margin-left:6px;font-weight:500}
.search{display:flex;align-items:center;gap:7px;background:#14171a;border:1px solid #2a2e35;border-radius:7px;padding:0 10px;height:32px;width:250px;color:#7b8190}
.search input{background:none;border:0;outline:0;color:#e2e7ec;font:12px -apple-system,sans-serif;width:100%}
.search svg{width:14px;height:14px;flex:none}
select{background:#14171a;color:#cbd0d6;border:1px solid #2a2e35;border-radius:7px;height:32px;padding:0 10px;font:12px -apple-system,sans-serif}
.spacer{flex:1}
.legend{display:flex;gap:6px;align-items:center;color:#6b7280;font-size:11px}
.status{color:#7ee8d9;font-size:12px;min-height:16px;margin:-4px 0 6px}
.body{flex:1;min-height:0;overflow:auto;padding-bottom:24px}
.tag{display:inline-block;font-size:10px;line-height:14px;padding:1px 6px;border-radius:5px;border:1px solid #3a414b;color:#b8c0ca;white-space:nowrap;font-style:normal;font-weight:500}
.tag.own{border-color:rgba(45,212,191,.6);color:#2dd4bf}
.tag.mk{background:rgba(45,212,191,.14);border-color:rgba(45,212,191,.45);color:#7ee8d9}
.tag.close{border-style:dashed}
.tag.miss{color:#9aa4ae;background:#16191d}
.star{background:none;border:0;padding:3px;cursor:pointer;color:#4b525c;display:inline-flex;line-height:0}
.star svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:#2dd4bf}.star.on svg{fill:#2dd4bf}
.star:hover{color:#b970ff}
.muted{color:#8a939d}
.vbar{display:inline-block;height:4px;border-radius:2px;background:#2a2e35;width:56px;vertical-align:middle;position:relative;overflow:hidden}
.vbar b{position:absolute;left:0;top:0;bottom:0;background:#8a939d;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1a1d21;border:1px solid #2a2e35;border-radius:7px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0}
.chip.best{border-color:rgba(45,212,191,.55);background:rgba(45,212,191,.07)}
.panel{background:#14171a;border:1px solid #2a2e35;border-radius:9px}
.empty{padding:40px;text-align:center;color:#8a939d}

/* A table */
.tbl{background:#14171a;border:1px solid #2a2e35;border-radius:9px;overflow:hidden}
.tr{display:grid;grid-template-columns:34px 230px 128px 1fr 104px;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid #20242a;min-height:42px}
.tr.th{border-top:0;background:#101316;color:#8a939d;font-size:11px;text-transform:uppercase;letter-spacing:.05em;min-height:32px;position:sticky;top:0;z-index:2}
.tr:not(.th):hover{background:#181c20}
.tr .n{font-weight:650;font-size:13px;line-height:1.25}
.tr .n small{display:block;color:#8a939d;font-weight:400;font-size:11px;margin-top:1px}
.tr .v{font-size:12px;color:#cbd0d6;display:flex;align-items:center;gap:8px;white-space:nowrap}
/* B grouped */
.jobs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.jobs button{background:#1a1d21;color:#cbd0d6;border:1px solid #2a2e35;border-radius:999px;padding:5px 11px;font:600 12px -apple-system,sans-serif;cursor:pointer}
.jobs button em{font-style:normal;opacity:.6;margin-left:5px;font-weight:500}
.jobs button.on{background:#2dd4bf;color:#0b0d10;border-color:#2dd4bf}
.groups{columns:2;column-gap:16px}
.grp{break-inside:avoid;margin-bottom:14px;background:#14171a;border:1px solid #2a2e35;border-radius:9px;overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#101316;font-weight:700;font-size:13px}
.gh span{font-weight:500;color:#8a939d;font-size:11px}
.sw{display:grid;grid-template-columns:26px minmax(0,1fr) 16px minmax(0,1.25fr) 36px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #20242a}
.sw .n{font-weight:650;font-size:13px;line-height:1.25}.sw .n small{display:block;color:#8a939d;font-weight:400;font-size:11px}
.sw .ar{color:#5b6470;font-size:14px;text-align:center}
.sw .chip{margin:0;flex-wrap:wrap}
.sw .more{background:#1a1d21;border:1px solid #2a2e35;color:#cbd0d6;border-radius:6px;font:600 11px sans-serif;padding:3px 0;cursor:pointer;width:34px}
.sw .more:hover{border-color:#9442dc}
.sw .more.on{background:#2dd4bf;color:#0b0d10;border-color:#2dd4bf}
.ex{grid-column:2/5;padding:0 0 2px;display:flex;flex-wrap:wrap}
/* C cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#14171a;border:1px solid #2a2e35;border-radius:9px;padding:12px 14px 10px}
.card:hover{border-color:#3a414b}
.card h3{margin:0;font-size:14px;line-height:1.25}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cm{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:11px;color:#8a939d}
.cm .vbar{width:70px}
.eqh{display:flex;align-items:center;gap:6px;font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.eql{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid #1e2227;font-size:12px}
.eql b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eql .mkr{color:#8a939d;font-size:11px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* D master-detail */
.md{display:grid;grid-template-columns:410px minmax(0,1fr);gap:16px;height:100%;min-height:0}
.lst{overflow:auto;min-height:0;padding-bottom:20px}
.li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.li:hover{background:#181c20}
.li.sel{background:#1a1d21;border-color:#2dd4bf}
.li .n{font-weight:650;font-size:13px}.li .n small{display:block;color:#8a939d;font-weight:400;font-size:11px}
.li .cnt{font-size:12px;color:#cbd0d6;text-align:right}.li .cnt small{display:block;color:#8a939d;font-size:10px}
.det{padding:20px 22px;overflow:auto;min-height:0}
.det h3{margin:0;font-size:22px;letter-spacing:-.01em}
.dm{display:flex;gap:10px;align-items:center;margin:8px 0 18px;color:#9aa4ae;font-size:12px}
.eqrow{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px;border:1px solid #2a2e35;border-radius:9px;margin-bottom:8px;background:#171a1e}
.eqrow.best{border-color:rgba(45,212,191,.55);background:rgba(45,212,191,.06)}
.eqrow .rk{width:26px;height:26px;border-radius:50%;background:#22262b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#cbd0d6}
.eqrow .nm{font-weight:650;font-size:15px}.eqrow .nm small{display:block;color:#8a939d;font-weight:400;font-size:12px;margin-top:2px}
.eqrow .tg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dh{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #5b6470;background:#14171a;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;color:#0b0d10}
.cb svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;opacity:0}
.cb.on,.cb.part{background:#2dd4bf;border-color:#2dd4bf}.cb.on svg,.cb.part svg{opacity:1}
.cb:hover{border-color:#b970ff}
.chip{cursor:pointer;gap:7px}
.chip:hover{border-color:#5b6470}
.chip.best{border-color:#7b8190;background:#1d2126}.chip.best>b{font-weight:700}
.chip>b{font-weight:500}
.chip.sel{border-color:#2dd4bf;background:rgba(45,212,191,.13)}
.chip .star{padding:0 0 0 2px}.chip .star svg{width:13px;height:13px}
.selbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;min-height:30px}
.btn.sm{padding:5px 10px;font-size:11px}
.cnt2{font-weight:700;color:#2dd4bf;font-size:13px;margin:0 6px 0 4px}
.cnt2.zero{color:#8a939d}
.btn.primary[disabled]{opacity:.4;cursor:default;background:#2dd4bf}
.mini{background:none;border:0;color:#9aa4ae;font:600 11px -apple-system,sans-serif;padding:2px 5px;cursor:pointer;border-radius:5px}
.mini:hover{color:#e2e7ec;background:#22262b}
.tr.m{grid-template-columns:240px 128px 1fr 118px}
.tr.o{grid-template-columns:54px 240px 128px 1fr 104px}
.tr.sl{background:rgba(45,212,191,.05)}
.sw{grid-template-columns:minmax(0,.85fr) 16px minmax(0,1.3fr) 40px}
.sw.o{grid-template-columns:44px minmax(0,1fr) auto auto}
.sw .more.has{border-color:#2dd4bf;color:#2dd4bf}
.ex{grid-column:1/5}
.gh .gg{display:flex;align-items:center;gap:2px}
.card.sl{border-color:rgba(45,212,191,.45)}
.eql{cursor:pointer}.eql:hover{background:#181c20}
.eqh .mini{margin-left:auto}
.li{grid-template-columns:44px minmax(0,1fr) auto}
.li.sel{border-color:#2dd4bf}
.pill{display:inline-block;background:#2dd4bf;color:#0b0d10;font-weight:700;font-size:11px;border-radius:6px;padding:1px 7px;margin-bottom:2px}
.pill.off{background:#22262b;color:#8a939d;font-weight:500}
.cb.part svg{display:none}.cb.part::after{content:"";width:8px;height:2px;background:#0b0d10;border-radius:1px}
.eqrow{grid-template-columns:22px 30px 30px minmax(0,1fr) auto;cursor:pointer}
.eqrow.sl{border-color:#2dd4bf;background:rgba(45,212,191,.1)}
.eqrow.best{border-color:#7b8190}
.eqrow.best.sl{border-color:#2dd4bf}
.dh .mini{margin-left:auto}
.sw{grid-template-columns:minmax(0,.75fr) 14px minmax(0,1.5fr) 38px}
.sw .chip{flex-wrap:nowrap}.chip>b{min-width:0}
</style></head><body>

/* ---------- C: card grid ---------- */
