<!doctype html><html><head><meta charset="utf-8"><title>AIMM promo host</title>
<style>
*{box-sizing:border-box;margin:0}
.co,.dot,#brand,#end,#hero,#ring,#bg{pointer-events:none}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff}
#bg{position:absolute;inset:-200px;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#o1{width:900px;height:900px;left:100px;top:0;background:#1d6fb8}
#o2{width:800px;height:800px;right:100px;bottom:0;background:#6b2fd0;opacity:.4}
#o3{width:700px;height:700px;left:700px;top:500px;background:#0f8f80;opacity:.35}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;z-index:2;will-change:transform}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;border-radius:22px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 160px rgba(45,212,191,.18);transition:filter 1.3s cubic-bezier(.2,.7,.2,1)}
#app.dim{filter:blur(16px) brightness(.42) saturate(1.2)}
#cursor{position:absolute;left:0;top:0;width:34px;height:34px;z-index:5;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(45,212,191,.6));transform-origin:3px 3px}
.ripple{position:absolute;border:3px solid #2dd4bf;border-radius:50%;pointer-events:none;z-index:4;width:20px;height:20px;margin:-10px 0 0 -10px;animation:rip .7s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(4);opacity:0}}
#ring{position:absolute;z-index:3;border:3px solid #2dd4bf;border-radius:18px;box-shadow:0 0 0 6px rgba(45,212,191,.12),0 0 50px rgba(45,212,191,.55),inset 0 0 40px rgba(45,212,191,.12);opacity:0;transition:opacity .5s}
#vig{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%)}
#lines{position:absolute;inset:0;z-index:7;pointer-events:none}
.co{position:absolute;left:0;top:0;z-index:8;display:flex;align-items:center;gap:16px;padding:20px 28px;border-radius:20px;background:rgba(8,12,14,.82);backdrop-filter:blur(20px);border:1px solid rgba(45,212,191,.4);box-shadow:0 0 60px rgba(45,212,191,.22),0 20px 60px rgba(0,0,0,.6);font-weight:600;font-size:34px;letter-spacing:-.02em;white-space:nowrap;opacity:0;filter:blur(10px);transition:opacity .55s ease,filter .55s ease}
.co.on{opacity:1;filter:blur(0)}
.co svg{width:36px;height:36px;stroke:#2dd4bf;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.co b{color:#2dd4bf;font-weight:700}
.dot{position:absolute;z-index:8;width:16px;height:16px;margin:-8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 0 6px rgba(45,212,191,.25),0 0 26px #2dd4bf;opacity:0;transition:opacity .4s}
#hero{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:center;padding:0 150px;pointer-events:none}
#hero .eye{font-size:26px;letter-spacing:.32em;font-weight:700;color:#2dd4bf;margin-bottom:34px}
#hero h1{font-size:158px;line-height:1.0;font-weight:800;letter-spacing:-.045em;margin-bottom:40px}
#hero h1 .l{display:block;overflow:hidden;padding-bottom:12px}
#hero h1 .w{display:inline-block;transform:translateY(115%);opacity:0;filter:blur(14px);transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity .9s,filter 1s}
#hero.in .w{transform:none;opacity:1;filter:none}
.g1{background:linear-gradient(90deg,#fbbf24,#f59e0b 40%,#fb7185);-webkit-background-clip:text;color:transparent}
.g2{background:linear-gradient(90deg,#36a8ed,#8b7cf6 50%,#2dd4bf);-webkit-background-clip:text;color:transparent}
#hero p{font-size:38px;font-weight:500;color:rgba(255,255,255,.78);max-width:1100px;line-height:1.35;margin-bottom:54px;opacity:0;transform:translateY(24px);transition:all .9s .9s cubic-bezier(.16,1,.3,1)}
#hero.in p{opacity:1;transform:none}
#hero .btns{display:flex;gap:22px;opacity:0;transform:translateY(24px);transition:all .9s 1.3s cubic-bezier(.16,1,.3,1)}
#hero.in .btns{opacity:1;transform:none}
.btn{font-size:32px;font-weight:700;padding:26px 52px;border-radius:999px}
.b1{background:#2dd4bf;color:#04201c;box-shadow:0 0 60px rgba(45,212,191,.5)}
.b2{border:2px solid rgba(255,255,255,.35);color:#fff}
#hero.out{transition:opacity .8s,transform .9s cubic-bezier(.7,0,.84,0),filter .8s;opacity:0;transform:translateY(-70px) scale(.97);filter:blur(10px)}
#brand{position:absolute;right:48px;bottom:36px;z-index:10;font-weight:800;font-size:34px;letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.8);opacity:0;transition:opacity .8s}
#brand i{font-style:normal;color:#fbbf24}#brand u{text-decoration:none;color:#36a8ed}
#brand small{display:block;font-size:13px;letter-spacing:.3em;font-weight:600;color:rgba(255,255,255,.65);text-align:right;margin-top:-2px}
#end{position:absolute;inset:0;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.84);backdrop-filter:blur(30px);opacity:0;pointer-events:none;transition:opacity 1s}
#end.on{opacity:1}
#end img{width:360px;transform:scale(.8);opacity:0;transition:all 1.2s .25s cubic-bezier(.16,1,.3,1);margin-bottom:40px}
#end.on img{transform:none;opacity:1}
#end h2{font-size:104px;font-weight:800;letter-spacing:-.045em;opacity:0;transform:translateY(40px);transition:all 1.1s .6s cubic-bezier(.16,1,.3,1);margin-bottom:26px}
#end.on h2{opacity:1;transform:none}
#end .u{font-size:38px;font-weight:600;color:#2dd4bf;letter-spacing:.02em;opacity:0;transition:opacity 1s 1.2s}
#end.on .u{opacity:1}
</style></head><body>
<div id="bg"><div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div></div>
<div id="world"><iframe id="app" src="/" class="dim"></iframe><div id="ring"></div>
<svg id="cursor" viewBox="0 0 34 34"><path d="M3 3 L3 27 L9.5 21 L14 31 L19 29 L14.5 19.5 L23 19 Z" fill="#fff" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div id="vig"></div><svg id="lines" width="1920" height="1080"></svg>
<div id="hero"><div class="eye">AI MIX MASTERS</div>
<h1><span class="l"><span class="w g1" style="transition-delay:.1s">Mix&nbsp;smarter.</span></span><span class="l"><span class="w g2" style="transition-delay:.45s">Master&nbsp;faster.</span></span></h1>
<p>Drop your mix. Get clear numbers, a fix list, and an AI coach that explains every move.</p>
<div class="btns"><div class="btn b1">Try AIMM</div><div class="btn b2">See it work</div></div></div>
<div id="brand"><i>AI</i><u>MM</u><small>AI MIX MASTERS</small></div>
<div id="end"><img src="/__logo.png"><h2><span class="g1">Mix smarter.</span> <span class="g2">Master faster.</span></h2><div class="u">aimixmasters.com</div></div>
<script>
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const $=id=>document.getElementById(id);
const H=window.H={cam:{cx:960,cy:540,z:1.06},cur:{x:1750,y:1000},tw:[],co:[],scroll:null,
 now:()=>performance.now()};
let camT=null,curT=null;
H.camTo=(cx,cy,z,d=1.6)=>{camT={f:{...H.cam},t:{cx,cy,z},s:H.now(),d:d*1000};H.camTarget={cx,cy,z}};
H.curTo=(x,y,d=1.0,bend=70)=>{curT={f:{...H.cur},t:{x,y},s:H.now(),d:d*1000,b:bend}};
H.curShow=v=>$('cursor').style.opacity=v?1:0;
H.click=()=>{const c=H.cur;const r=document.createElement('div');r.className='ripple';r.style.left=c.x+'px';r.style.top=c.y+'px';$('world').appendChild(r);setTimeout(()=>r.remove(),800);H.press=H.now()};
H.toScreen=(x,y)=>{const c=H.camTarget||H.cam,z=c.z;return{x:x*z+960-c.cx*z,y:y*z+540-c.cy*z}};
H.ring=(x,y,w,h)=>{const r=$('ring');r.style.left=x+'px';r.style.top=y+'px';r.style.width=w+'px';r.style.height=h+'px';r.style.opacity=1};
H.ringOff=()=>$('ring').style.opacity=0;
H.callout=(id,svg,html,wx,wy,ox,oy)=>{const e=document.createElement('div');e.className='co';e.id='co'+id;e.innerHTML=svg+'<span>'+html+'</span>';document.body.appendChild(e);
 const d=document.createElement('div');d.className='dot';d.id='dot'+id;document.body.appendChild(d);
 const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('stroke','#2dd4bf');l.setAttribute('stroke-width','2.5');l.setAttribute('stroke-opacity','.8');l.id='ln'+id;$('lines').appendChild(l);
 H.co.push({id,e,d,l,wx,wy,ox,oy,on:false});setTimeout(()=>{e.classList.add('on');d.style.opacity=1;H.co.find(c=>c.id==id).on=true},30)};
H.coOff=id=>{const c=H.co.find(c=>c.id==id);if(!c)return;c.e.classList.remove('on');c.d.style.opacity=0;c.l.setAttribute('stroke-opacity',0);setTimeout(()=>{c.e.remove();c.d.remove();c.l.remove();H.co=H.co.filter(x=>x!==c)},700)};
H.coOffAll=()=>H.co.map(c=>c.id).forEach(H.coOff);
H.scrollTo=(y,d=1.2)=>{const w=$('app').contentWindow;H.scroll={f:w.scrollY,t:y,s:H.now(),d:d*1000}};
const frame=()=>{const n=H.now();
 if(camT){let p=Math.min(1,(n-camT.s)/camT.d),e=ease(p);for(const k of['cx','cy','z'])H.cam[k]=camT.f[k]+(camT.t[k]-camT.f[k])*e;if(p>=1)camT=null}
 if(curT){let p=Math.min(1,(n-curT.s)/curT.d),e=ease(p);const f=curT.f,t=curT.t;const mx=(f.x+t.x)/2+curT.b,my=(f.y+t.y)/2-curT.b;
  H.cur.x=(1-e)*(1-e)*f.x+2*(1-e)*e*mx+e*e*t.x;H.cur.y=(1-e)*(1-e)*f.y+2*(1-e)*e*my+e*e*t.y;if(p>=1)curT=null}
 if(H.scroll){let p=Math.min(1,(n-H.scroll.s)/H.scroll.d);$('app').contentWindow.scrollTo(0,H.scroll.f+(H.scroll.t-H.scroll.f)*ease(p));if(p>=1)H.scroll=null}
 const c=H.cam,z=c.z,tx=960-c.cx*z,ty=540-c.cy*z;
 $('world').style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
 $('bg').style.transform=`translate(${tx*.12}px,${ty*.12}px) scale(${1+(z-1)*.2})`;
 const cs=1.5/Math.pow(z,.55),pr=H.press&&n-H.press<160?.82:1;
 $('cursor').style.transform=`translate(${H.cur.x}px,${H.cur.y}px) scale(${cs*pr})`;
 for(const o of H.co){const sx=o.wx*z+tx,sy=o.wy*z+ty;const w=o.e.offsetWidth,h=o.e.offsetHeight;
  const px=sx+o.ox-(o.ox<0?w:0),py=sy+o.oy-h/2;o.e.style.transform=`translate(${px}px,${py}px)`;
  o.d.style.left=sx+'px';o.d.style.top=sy+'px';
  const ex=o.ox<0?px+w:px,ey=py+h/2;o.l.setAttribute('x1',sx);o.l.setAttribute('y1',sy);o.l.setAttribute('x2',ex);o.l.setAttribute('y2',ey)}
 requestAnimationFrame(frame)};
frame();
</script></body></html>
