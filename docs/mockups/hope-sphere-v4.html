<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hope Sphere v4</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111827;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: monospace;
  color: #ccc;
  gap: 0;
}

#stage {
  width: 420px;
  height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#stage canvas {
  display: block;
}

#state-label {
  margin-top: 16px;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7c3aed;
  height: 20px;
  text-align: center;
}

#buttons {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

#buttons button {
  background: transparent;
  border: 1px solid #2a2040;
  color: #888;
  font-family: monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

#buttons button:hover {
  border-color: #7c3aed;
  color: #c4b5fd;
}

#buttons button.active {
  background: #7c3aed;
  border-color: #7c3aed;
  color: #fff;
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="state-label">IDLE</div>
<div id="buttons">
  <button data-state="idle"      class="active">Idle</button>
  <button data-state="listening"          >Listening</button>
  <button data-state="speaking"           >Speaking</button>
  <button data-state="thinking"           >Thinking</button>
  <button data-state="emphatic"           >Emphatic</button>
  <button data-state="happy"              >Happy</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {

  // ─── SHADER SOURCE — ASCII array-join pattern, no backticks ──────────────

  var VERT_SHADER = [
    'uniform float uT;',
    'uniform float uAmp;',
    'uniform float uFreq;',
    'uniform float uSpd;',
    'uniform float uRotY;',
    'attribute vec3 aBase;',
    'attribute float aPhi;',
    'attribute float aTheta;',
    'void main() {',
    '  float c = cos(uRotY);',
    '  float s = sin(uRotY);',
    '  vec3 pos = vec3(',
    '    aBase.x * c - aBase.z * s,',
    '    aBase.y,',
    '    aBase.x * s + aBase.z * c',
    '  );',
    '  float d1 = sin(aPhi   * uFreq        + uT * uSpd * 1.0);',
    '  float d2 = sin(aTheta * uFreq * 0.7  + uT * uSpd * 1.3);',
    '  float d3 = sin((aPhi + aTheta) * uFreq * 0.5 + uT * uSpd * 0.8);',
    '  float disp = (d1 * 0.5 + d2 * 0.3 + d3 * 0.2) * uAmp;',
    '  vec3 norm = normalize(aBase);',
    '  pos = pos + norm * disp;',
    '  vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);',
    '  float dist = length(mvPos.xyz);',
    '  gl_PointSize = clamp(280.0 / dist, 2.0, 3.5);',
    '  gl_Position = projectionMatrix * mvPos;',
    '}'
  ].join('\n');

  var FRAG_SHADER = [
    'uniform vec3 uColor;',
    'void main() {',
    '  vec2 uv = gl_PointCoord - 0.5;',
    '  float d = length(uv) * 2.0;',
    '  if (d > 1.0) discard;',
    '  gl_FragColor = vec4(uColor, 1.0);',
    '}'
  ].join('\n');

  // ─── STATE CONFIGS ────────────────────────────────────────────────────────

  var STATES = {
    idle:      { amp: 0.04, freq: 2.0, spd: 0.4, rotSpd: 0.15 },
    listening: { amp: 0.10, freq: 3.0, spd: 0.7, rotSpd: 0.30 },
    speaking:  { amp: 0.18, freq: 4.0, spd: 1.4, rotSpd: 0.55 },
    thinking:  { amp: 0.12, freq: 2.5, spd: 0.3, rotSpd: 0.20 },
    emphatic:  { amp: 0.22, freq: 5.0, spd: 1.8, rotSpd: 0.80 },
    happy:     { amp: 0.35, freq: 6.0, spd: 2.5, rotSpd: 1.10 }
  };

  // ─── RENDERER SETUP ───────────────────────────────────────────────────────

  var SIZE = 420;
  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
  renderer.setSize(SIZE, SIZE);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  document.getElementById('stage').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.z = 2.8;

  // ─── BUILD MANUAL UV SPHERE ───────────────────────────────────────────────

  var LAT = 60;
  var LON = 60;
  var PI = Math.PI;

  var basePositions = [];
  var phiValues     = [];
  var thetaValues   = [];

  for (var i = 0; i <= LAT; i++) {
    var phi = (i / LAT) * PI;
    for (var j = 0; j <= LON; j++) {
      var theta = (j / LON) * 2.0 * PI;
      var x = Math.sin(phi) * Math.cos(theta);
      var y = Math.cos(phi);
      var z = Math.sin(phi) * Math.sin(theta);
      basePositions.push(x, y, z);
      phiValues.push(phi);
      thetaValues.push(theta);
    }
  }

  var geom = new THREE.BufferGeometry();

  var baseBuf   = new Float32Array(basePositions);
  var phiBuf    = new Float32Array(phiValues);
  var thetaBuf  = new Float32Array(thetaValues);

  geom.setAttribute('aBase',  new THREE.BufferAttribute(baseBuf,  3));
  geom.setAttribute('aPhi',   new THREE.BufferAttribute(phiBuf,   1));
  geom.setAttribute('aTheta', new THREE.BufferAttribute(thetaBuf, 1));

  // position attribute required by Three.js (set to aBase values; shader overrides)
  geom.setAttribute('position', new THREE.BufferAttribute(baseBuf.slice(), 3));

  // ─── MATERIAL ─────────────────────────────────────────────────────────────

  var uniforms = {
    uT:     { value: 0.0 },
    uAmp:   { value: STATES.idle.amp },
    uFreq:  { value: STATES.idle.freq },
    uSpd:   { value: STATES.idle.spd },
    uRotY:  { value: 0.0 },
    uColor: { value: new THREE.Vector3(0.486, 0.224, 0.929) }
  };

  var mat = new THREE.ShaderMaterial({
    uniforms:       uniforms,
    vertexShader:   VERT_SHADER,
    fragmentShader: FRAG_SHADER,
    transparent:    true
  });

  var points = new THREE.Points(geom, mat);
  scene.add(points);

  // ─── ANIMATION STATE ──────────────────────────────────────────────────────

  var cur = {
    amp:    STATES.idle.amp,
    freq:   STATES.idle.freq,
    spd:    STATES.idle.spd,
    rotSpd: STATES.idle.rotSpd
  };

  var tgt = {
    amp:    STATES.idle.amp,
    freq:   STATES.idle.freq,
    spd:    STATES.idle.spd,
    rotSpd: STATES.idle.rotSpd
  };

  var rotY   = 0.0;
  var clock  = new THREE.Clock();

  function lerp(a, b, k) { return a + (b - a) * k; }

  function animate() {
    requestAnimationFrame(animate);

    var dt = clock.getDelta();
    var t  = clock.getElapsedTime();
    var k  = 1.0 - Math.pow(0.05, dt);

    // smooth lerp toward targets
    cur.amp    = lerp(cur.amp,    tgt.amp,    k);
    cur.freq   = lerp(cur.freq,   tgt.freq,   k);
    cur.spd    = lerp(cur.spd,    tgt.spd,    k);
    cur.rotSpd = lerp(cur.rotSpd, tgt.rotSpd, k);

    rotY += cur.rotSpd * dt;

    uniforms.uT.value    = t;
    uniforms.uAmp.value  = cur.amp;
    uniforms.uFreq.value = cur.freq;
    uniforms.uSpd.value  = cur.spd;
    uniforms.uRotY.value = rotY;

    renderer.render(scene, camera);
  }

  animate();

  // ─── BUTTON WIRING ────────────────────────────────────────────────────────

  var label   = document.getElementById('state-label');
  var buttons = document.querySelectorAll('#buttons button');

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var name = btn.getAttribute('data-state');
      if (!STATES[name]) return;

      // update target
      tgt.amp    = STATES[name].amp;
      tgt.freq   = STATES[name].freq;
      tgt.spd    = STATES[name].spd;
      tgt.rotSpd = STATES[name].rotSpd;

      // update UI
      label.textContent = name.toUpperCase();
      buttons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

})();
</script>
</body>
</html>
