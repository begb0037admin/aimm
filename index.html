*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#e5e7eb;line-height:1.5;padding:0;min-height:100vh}
/* R3 SHELL GRID (Kevin 2026-08-30): one 16px gutter token drives every gap.
   .container is a 2-track grid - main app area (col 1) | permanent Hope rail
   (col 2). Full rules in the R3 SHELL GRID block at the end of the stylesheet. */
:root{--gutter:16px;--page-gutter:16px;--hope-w:380px;--hope-w-min:320px;--hope-w-max:560px;--mc-rail-w:240px;--mc-rail-min:200px;--mc-rail-max:340px}
@media (min-width:1600px){:root{--page-gutter:32px}} /* board item 20: symmetric page gutter, 32px each side on wide screens */
.container{max-width:2000px;margin-inline:auto;padding:var(--gutter) var(--page-gutter);display:grid;grid-template-columns:minmax(0,1fr) var(--hope-w);gap:var(--gutter);align-items:start}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:nowrap;margin-bottom:0;grid-column:1}
.header-top>div:first-child{min-width:0}          /* R3 2026-08-31: title block shrinks so actions stay on the title row */
.header-top .header-actions{flex-shrink:0}
h1{font-size:26px;font-weight:700;color:#f9fafb}
.subtitle{color:#9ca3af;font-size:13px;margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,input,textarea{font-family:inherit;font-size:13px}
.platform-select,.genre-select{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:6px;padding:8px 10px}
.genre-select{border-color:#854d0e}
.btn{background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:#6d28d9}
.btn.secondary{background:#374151}
.btn.secondary:hover{background:#4b5563}
.btn.ghost{background:transparent;color:#9ca3af;border:1px solid #374151}
.btn.ghost:hover{color:#e5e7eb;border-color:#6b7280}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.green{background:#059669}.btn.green:hover{background:#047857}
.btn.red{background:#dc2626}.btn.red:hover{background:#b91c1c}
.btn.amber{background:#b45309;color:#fef3c7}.btn.amber:hover{background:#92400e}
.btn.purple{background:#a855f7;color:#fff;box-shadow:0 0 0 1px #c084fc inset}
.btn.purple:hover{background:#9333ea;box-shadow:0 0 0 1px #d8b4fe inset}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* Tab nav (2026-05-12 refined) — tabs size to their content (icon-only
   when inactive, icon + label when active or hovered), so each tab has
   room to breathe rather than fighting for equal slices of the row.
   Bottom-aligned so the taller active tab rises above the row like a
   browser folder tab, then nudges 1px down via translateY(1px) to overlap
   the bottom border for a continuous folder seam. Left-aligned row with
   a comfortable gap. Wraps on narrow viewports. */
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #374151;margin-bottom:0;align-items:flex-end;justify-content:flex-start;grid-column:1}
.tabs .tab{justify-content:center;text-align:center}
.tab{background:transparent;color:#9ca3af;border:none;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.2px;display:inline-flex;align-items:center;gap:7px;transition:color .12s,background .12s,border-color .12s,font-size .15s,transform .15s}
.tab:hover{color:#d1d5db;background:rgba(255,255,255,.02)}
/* Section accents: tabs that are conceptually "always green" (Chain Builder,
   Diagnose, Chat with Claude) keep the green TEXT colour even when not active,
   but the underline stays clear until the tab is selected. Same idea for the
   Hope tab in orange. The selected tab gets the underline + a 16px size
   bump + a tiny scale lift so it visibly dominates the row. */
.tab.active-section{color:#34d399}
.tab.voice-tab{color:#f97316}
.tab.active{color:#a78bfa;border-bottom-color:#a78bfa;font-size:16px;font-weight:700;transform:translateY(1px)}
/* UNIFIED TAB COLOUR (2026-05-10) — every tab is the same purple when active
   or hovered, regardless of which persona owns it. Hope is purple #a855f7
   (Tailwind purple-500, matches the Import Plugin button). When other
   personas come online and we want per-tab colour again, the legacy
   per-persona block below is preserved as a comment for revival. */
.tab[data-persona-label]{color:#9ca3af}
.tab.active[data-persona-label]{font-size:16px;font-weight:700;transform:translateY(1px)}
.tab:hover{color:#c4b5fd;border-bottom-color:#c4b5fd}
.tab.active{color:#a855f7;border-bottom-color:#a855f7}
.tab.active .tab-ico{filter:drop-shadow(0 0 10px rgba(168,85,247,.55))}
/* BROWSER-TAB VISUAL STYLE (2026-05-12, refined Option C) — active tab reads
   as a folder-style browser tab: 3px purple top strip + grey outline on the
   sides + dark fill + generous 11/26/14 padding, then nudged 1px DOWN so it
   visually overlaps the .tabs container's border-bottom for a continuous
   folder seam. z-index:2 keeps the active tab above the neighbour dividers.
   Inactive tabs stay recessed text-only with a subtle right-side divider so
   the row reads as a tabbed surface, not a flat list. The bottom-underline
   is killed on active because the fill + top-strip already signal selection
   — keeping the underline alongside the fill double-stated the affordance. */
.tab{border-radius:8px 8px 0 0;position:relative}
.tab:not(:last-child):not(.active)::after{content:'';position:absolute;right:-4px;top:25%;bottom:25%;width:1px;background:#374151;opacity:.6}
.tab:not(.active):hover{background:rgba(31,41,55,.3)}
.tab.active{background:#1f2937;border-left:1px solid #374151;border-right:1px solid #374151;border-top:3px solid #a855f7;border-bottom-color:transparent;padding:11px 26px 14px;transform:translateY(1px);z-index:2}
.tab.active::after{display:none}
/* TAB LABELS — labels stay visible on every tab. The earlier icon-only
   experiment (hide-on-inactive, reveal-on-hover) was reverted 2026-05-12
   per Kev's preference for always-readable tab nav. The content-sized
   layout + bottom-aligned row above still gives each tab room to breathe. */
