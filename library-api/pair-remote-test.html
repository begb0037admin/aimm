<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PluginHub Foundation remote pairing check</title>
<h1>PluginHub Foundation remote pairing check</h1>
<p>Loopback-only test page. It sends API requests to the disposable local Worker at <code>http://127.0.0.1:8787</code>. Tokens and pairing credentials stay in memory and are never displayed. Never point this page at a remote API.</p>
<button id="login">Sign in as Test User A</button>
<button id="pair" disabled>Create, approve and deliver one test pairing</button>
<button id="other">Sign in as Test User B in a popup</button>
<button id="isolation" disabled>Probe User B against User A’s test device</button>
<button id="revoke" disabled>Revoke User A’s test device and verify credential rejection</button>
<pre id="result">Ready. No token or pairing data loaded.</pre>
<script>
(() => {
  const domain = "dev-cxmqjc40zltqlx7l.us.auth0.com";
  const clientId = "3EbH8eIpW9FxYvKoXIeYtRvhcGWGtwPA";
  const audience = "https://aimm-library-api-dev";
  const api = "http://127.0.0.1:8787";
  const redirectUri = location.origin + location.pathname;
  const $ = (id) => document.getElementById(id);
  const loopback = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
  const controls = ["login", "pair", "other", "isolation", "revoke"];
  if (!loopback || location.protocol !== "http:") {
    controls.forEach((id) => { $(id).disabled = true; });
    $("result").textContent = "Blocked: this test must be served over HTTP from localhost or 127.0.0.1.";
    return;
  }
  const popup = new URLSearchParams(location.search).has("popup");
  let ownerToken = null, otherToken = null, csrfToken = null;
  let pairingId = null, pollingSecret = null, phrase = null, deviceId = null, deviceCredential = null;
  const status = (s) => { $("result").textContent = s; };
  const bytes64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
  const random64 = (n=32) => bytes64(crypto.getRandomValues(new Uint8Array(n)));
  const apiFetch = (path, init={}) => fetch(api + path, { credentials:"include", ...init });
  async function login() {
    const verifier=random64(), state=random64(24);
    sessionStorage.setItem("pair-test-verifier",verifier);
    sessionStorage.setItem("pair-test-state",state);
    const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));
    const url=new URL("https://"+domain+"/authorize");
    url.search=new URLSearchParams({client_id:clientId,response_type:"code",prompt:"login",redirect_uri:redirectUri,
      scope:"openid profile email read:library manage:devices",audience,state,code_challenge:bytes64(digest),code_challenge_method:"S256"}).toString();
    location.assign(url.toString());
  }
  async function callback() {
    const q=new URLSearchParams(location.search), code=q.get("code");
    if (!code && !q.has("error")) return;
    history.replaceState(null,"",location.pathname + (popup ? "?popup=1" : ""));
    if(q.has("error")) throw new Error("Auth0 sign-in failed: "+q.get("error"));
    const state=sessionStorage.getItem("pair-test-state"), verifier=sessionStorage.getItem("pair-test-verifier");
    sessionStorage.removeItem("pair-test-state"); sessionStorage.removeItem("pair-test-verifier");
    if(!state || state!==q.get("state") || !verifier) throw new Error("OAuth state/PKCE check failed");
    const response=await fetch("https://"+domain+"/oauth/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({grant_type:"authorization_code",client_id:clientId,code,redirect_uri:redirectUri,code_verifier:verifier})});
    const data=await response.json(); if(!response.ok || typeof data.access_token!=="string") throw new Error("Auth0 token exchange HTTP "+response.status);
    if(popup) { if(!window.opener) throw new Error("Popup has no opener"); window.opener.postMessage({kind:"pair-test-b-token",token:data.access_token},location.origin); window.close(); return; }
    ownerToken=data.access_token;
    const payload=JSON.parse(atob(ownerToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    const scopes=(payload.scope||"").split(/\s+/);
    if(!scopes.includes("manage:devices") || !scopes.includes("read:library")) throw new Error("Fresh Auth0 token lacks required development API scopes");
    const session=await apiFetch("/v1/session",{method:"POST",headers:{authorization:"Bearer "+ownerToken}});
    const body=await session.json(); if(!session.ok) throw new Error("API session exchange HTTP "+session.status);
    csrfToken=body.csrf_token; $("pair").disabled=false;
    status("Test User A signed in; required scopes verified; development API session established. Token remains in memory.");
  }
  async function pair() {
    const key=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
    const exported=await crypto.subtle.exportKey("jwk",key.publicKey);
    const publicKey={kty:"EC",crv:"P-256",x:exported.x,y:exported.y};
    const nonce=random64();
    const fingerprint=bytes64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify(publicKey)))
      ).replace(/-/g,"+").replace(/_/g,"/");
    const fingerprintHex=Array.from(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify(publicKey))),b=>b.toString(16).padStart(2,"0")).join("");
    const signature=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},key.privateKey,new TextEncoder().encode(`AIMM-PAIR-INIT\n${nonce}\n${fingerprintHex}`));
    const created=await apiFetch("/v1/pairings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({device_name:"Foundation temporary test Mac",public_key:publicKey,client_nonce:nonce,proof_signature:bytes64(signature)})});
    const c=await created.json(); if(created.status!==201) throw new Error("Pair request HTTP "+created.status);
    pairingId=c.pairing_id; pollingSecret=c.polling_secret; phrase=c.verification_phrase;
    const viewed=await apiFetch("/v1/pairings/"+pairingId); const v=await viewed.json();
    if(!viewed.ok || v.verification_phrase!==phrase) throw new Error("Owner phrase verification failed (HTTP "+viewed.status+")");
    const approved=await apiFetch("/v1/pairings/"+pairingId+"/approve",{method:"POST",headers:{"content-type":"application/json","x-csrf-token":csrfToken},body:JSON.stringify({verification_phrase:v.verification_phrase})});
    if(!approved.ok) throw new Error("Owner approval HTTP "+approved.status);
    const delivered=await apiFetch("/v1/pairings/"+pairingId+"/poll",{method:"POST",headers:{"x-pairing-secret":pollingSecret}}); const d=await delivered.json();
    if(!delivered.ok || d.status!=="paired" || !d.device_credential) throw new Error("Credential delivery HTTP "+delivered.status);
    deviceId=d.device_id; deviceCredential=d.device_credential;
    const secondPoll=await apiFetch("/v1/pairings/"+pairingId+"/poll",{method:"POST",headers:{"x-pairing-secret":pollingSecret}});
    if(secondPoll.status!==410) throw new Error("One-time delivery check expected HTTP 410; got "+secondPoll.status);
    $("other").disabled=false; $("revoke").disabled=false;
    status("Pairing proof, owner phrase check, approval, one-time credential delivery and repeat-poll rejection passed. Temporary device awaits cross-account probe and revocation.");
  }
  async function signInOther() {
    const w=window.open(redirectUri+"?popup=1","pair-test-user-b","popup,width=620,height=760");
    if(!w) throw new Error("Auth0 test popup was blocked");
    w.focus();
  }
  window.addEventListener("message",(event)=>{
    if(event.origin!==location.origin || event.data?.kind!=="pair-test-b-token" || typeof event.data.token!=="string") return;
    otherToken=event.data.token; $("isolation").disabled=false;
    status("Test User B signed in in an isolated popup; token remains in memory. Ready for cross-account probe.");
  });
  async function isolation() {
    const response=await apiFetch("/v1/devices/"+deviceId+"/revoke",{method:"POST",headers:{authorization:"Bearer "+otherToken}});
    if(response.status!==404) throw new Error("Cross-account device revoke expected HTTP 404; got "+response.status);
    status("Cross-account rejection passed: Test User B received HTTP 404 for User A’s device.");
  }
  async function revoke() {
    const response=await apiFetch("/v1/devices/"+deviceId+"/revoke",{method:"POST",headers:{authorization:"Bearer "+ownerToken}});
    if(!response.ok) throw new Error("Owner revoke HTTP "+response.status);
    const rotation=await apiFetch("/v1/devices/"+deviceId+"/credentials/rotate",{method:"POST",headers:{authorization:"Bearer "+deviceCredential}});
    if(rotation.status!==401) throw new Error("Revoked device credential expected HTTP 401; got "+rotation.status);
    status("Owner revoked the temporary device and credential. Reuse check returned HTTP 401. Test tokens and credentials remain only in memory.");
  }
  async function run(f){try{await f()}catch(e){status("Check failed: "+(e.message||"request failed"))}}
  $("login").onclick=()=>run(login); $("pair").onclick=()=>run(pair); $("other").onclick=()=>run(signInOther);
  $("isolation").onclick=()=>run(isolation); $("revoke").onclick=()=>run(revoke);
  run(callback);
})();
</script>
